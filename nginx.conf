# El proxy TLS/CDN debe enviar X-Forwarded-Proto: https al origen.
# El origen nunca publica una variante HTTP ni www como contenido canónico.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://asysdigital.com$request_uri;
}

server {
    listen 80;
    server_name www.asysdigital.com;
    return 301 https://asysdigital.com$request_uri;
}

server {
    listen 80;
    server_name asysdigital.com;

    # Si se accede directamente por HTTP, consolidar en HTTPS. Cuando el TLS
    # se termina antes de Nginx, el proxy conserva el protocolo original.
    if ($http_x_forwarded_proto != "https") {
        return 301 https://asysdigital.com$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
