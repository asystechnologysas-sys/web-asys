<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <!-- Header bar -->
  <rect x="20" y="20" width="760" height="50" rx="8" fill="#1e293b"/>
  <circle cx="50" cy="45" r="12" fill="#2563eb"/>
  <text x="72" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Tienda Sra. Luzmila - Punto de Venta &amp; Nequi</text>

  <!-- Left panel: Products grid -->
  <rect x="20" y="85" width="480" height="345" rx="8" fill="#1e293b"/>
  <text x="40" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">CATÁLOGO DE PRODUCTOS</text>

  <!-- Product items -->
  <rect x="40" y="130" width="135" height="85" rx="6" fill="#334155"/>
  <text x="50" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Arroz 1Kg</text>
  <text x="50" y="180" font-family="sans-serif" font-size="12" fill="#38bdf8">$4,200 COP</text>

  <rect x="190" y="130" width="135" height="85" rx="6" fill="#334155"/>
  <text x="200" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Aceite 900ml</text>
  <text x="200" y="180" font-family="sans-serif" font-size="12" fill="#38bdf8">$8,500 COP</text>

  <rect x="340" y="130" width="135" height="85" rx="6" fill="#334155"/>
  <text x="350" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Leche 1L</text>
  <text x="350" y="180" font-family="sans-serif" font-size="12" fill="#38bdf8">$3,900 COP</text>

  <rect x="40" y="230" width="135" height="85" rx="6" fill="#334155"/>
  <text x="50" y="260" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Pan Unidad</text>
  <text x="50" y="280" font-family="sans-serif" font-size="12" fill="#38bdf8">$600 COP</text>

  <rect x="190" y="230" width="135" height="85" rx="6" fill="#334155"/>
  <text x="200" y="260" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Huevos Cubeta</text>
  <text x="200" y="280" font-family="sans-serif" font-size="12" fill="#38bdf8">$16,000 COP</text>

  <rect x="340" y="230" width="135" height="85" rx="6" fill="#334155"/>
  <text x="350" y="260" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Café 250g</text>
  <text x="350" y="280" font-family="sans-serif" font-size="12" fill="#38bdf8">$7,200 COP</text>

  <!-- Right panel: Cart & Nequi Payment -->
  <rect x="515" y="85" width="265" height="345" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="535" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">VENTA ACTUAL</text>
  <line x1="535" y1="125" x2="760" y2="125" stroke="#334155" stroke-width="1"/>
  
  <text x="535" y="150" font-family="sans-serif" font-size="12" fill="#cbd5e1">1x Aceite 900ml</text>
  <text x="710" y="150" font-family="sans-serif" font-size="12" fill="#ffffff">$8,500</text>

  <text x="535" y="175" font-family="sans-serif" font-size="12" fill="#cbd5e1">2x Arroz 1Kg</text>
  <text x="710" y="175" font-family="sans-serif" font-size="12" fill="#ffffff">$8,400</text>

  <rect x="535" y="210" width="225" height="40" rx="6" fill="#1e293b"/>
  <text x="545" y="235" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">TOTAL: $16,900 COP</text>

  <!-- Payment Methods Badges -->
  <text x="535" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">MÉTODO DE PAGO:</text>
  
  <rect x="535" y="290" width="65" height="30" rx="4" fill="#ff007a"/>
  <text x="546" y="310" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Nequi</text>

  <rect x="610" y="290" width="70" height="30" rx="4" fill="#e11d48"/>
  <text x="617" y="310" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Daviplata</text>

  <rect x="690" y="290" width="70" height="30" rx="4" fill="#16a34a"/>
  <text x="702" y="310" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Efectivo</text>

  <rect x="535" y="335" width="225" height="30" rx="4" fill="#d97706"/>
  <text x="585" y="355" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Anotar en Fiado</text>

  <!-- Action button -->
  <rect x="535" y="380" width="225" height="40" rx="6" fill="#2563eb"/>
  <text x="585" y="405" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">COBRAR VENTA</text>
</svg>
