<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b132b"/>
  <!-- Header bar -->
  <rect x="20" y="20" width="760" height="50" rx="8" fill="#1c2541"/>
  <circle cx="50" cy="45" r="14" fill="#3a506b"/>
  <text x="44" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6fffe9">JM</text>
  <text x="76" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Barbería Jorge Mendoza - Agendamiento 24/7</text>

  <!-- Barber profile & Service selector -->
  <rect x="20" y="85" width="460" height="345" rx="8" fill="#1c2541"/>
  <text x="40" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6fffe9">SELECCIONA TU SERVICIO</text>

  <!-- Service item 1 -->
  <rect x="40" y="130" width="420" height="60" rx="6" fill="#3a506b"/>
  <text x="60" y="158" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Corte Urbano &amp; Perfilado</text>
  <text x="60" y="176" font-family="sans-serif" font-size="12" fill="#cbd5e1">Duración: 40 min</text>
  <text x="370" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6fffe9">$25,000</text>

  <!-- Service item 2 -->
  <rect x="40" y="200" width="420" height="60" rx="6" fill="#3a506b"/>
  <text x="60" y="228" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Corte de Cabello + Barba VIP</text>
  <text x="60" y="246" font-family="sans-serif" font-size="12" fill="#cbd5e1">Duración: 60 min (Incluye Toalla Caliente)</text>
  <text x="370" y="235" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6fffe9">$40,000</text>

  <!-- Service item 3 -->
  <rect x="40" y="270" width="420" height="60" rx="6" fill="#3a506b"/>
  <text x="60" y="298" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Arreglo de Barba &amp; Pigmentación</text>
  <text x="60" y="316" font-family="sans-serif" font-size="12" fill="#cbd5e1">Duración: 30 min</text>
  <text x="370" y="305" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6fffe9">$20,000</text>

  <rect x="40" y="350" width="420" height="60" rx="6" fill="#1c2541" stroke="#6fffe9" stroke-width="1"/>
  <text x="60" y="385" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Atendido por: Barbero Jorge Mendoza</text>

  <!-- Right Panel: Calendar & WhatsApp Confirmation -->
  <rect x="500" y="85" width="280" height="345" rx="8" fill="#1c2541"/>
  <text x="520" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SELECCIONA FECHA Y HORA</text>

  <!-- Calendar hours slots -->
  <rect x="520" y="135" width="115" height="35" rx="4" fill="#3a506b"/>
  <text x="550" y="157" font-family="sans-serif" font-size="12" fill="#ffffff">09:00 AM</text>

  <rect x="645" y="135" width="115" height="35" rx="4" fill="#3a506b"/>
  <text x="675" y="157" font-family="sans-serif" font-size="12" fill="#ffffff">10:00 AM</text>

  <rect x="520" y="180" width="115" height="35" rx="4" fill="#2563eb"/>
  <text x="550" y="202" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">11:00 AM ✓</text>

  <rect x="645" y="180" width="115" height="35" rx="4" fill="#3a506b"/>
  <text x="675" y="202" font-family="sans-serif" font-size="12" fill="#ffffff">02:00 PM</text>

  <rect x="520" y="225" width="115" height="35" rx="4" fill="#3a506b"/>
  <text x="550" y="247" font-family="sans-serif" font-size="12" fill="#ffffff">03:30 PM</text>

  <rect x="645" y="225" width="115" height="35" rx="4" fill="#3a506b"/>
  <text x="675" y="247" font-family="sans-serif" font-size="12" fill="#ffffff">05:00 PM</text>

  <!-- WhatsApp notification status card -->
  <rect x="520" y="275" width="240" height="70" rx="6" fill="#0f172a" stroke="#25d366" stroke-width="1"/>
  <text x="535" y="300" font-family="sans-serif" font-size="11" font-weight="bold" fill="#25d366">✓ Recordatorio Automático WhatsApp</text>
  <text x="535" y="320" font-family="sans-serif" font-size="11" fill="#cbd5e1">Se enviará alerta 2 hrs antes del turno</text>

  <!-- Action button -->
  <rect x="520" y="365" width="240" height="45" rx="6" fill="#25d366"/>
  <text x="560" y="392" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">CONFIRMAR MI CITA</text>
</svg>
