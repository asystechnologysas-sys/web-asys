<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <!-- Header bar with Universidad del Magdalena Branding -->
  <rect x="20" y="20" width="760" height="55" rx="8" fill="#1e3a8a"/>
  <circle cx="55" cy="47" r="16" fill="#fbbf24"/>
  <text x="47" y="53" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">UM</text>
  <text x="82" y="44" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">UNIVERSIDAD DEL MAGDALENA</text>
  <text x="82" y="61" font-family="sans-serif" font-size="12" fill="#93c5fd">Programa de Ingeniería de Sistemas | Chatbot IA &amp; PLN - José Narváez</text>

  <!-- Chat container -->
  <rect x="20" y="90" width="760" height="340" rx="8" fill="#1e293b"/>

  <!-- Chat message 1 (Student) -->
  <rect x="360" y="115" width="400" height="55" rx="12" fill="#2563eb"/>
  <text x="380" y="137" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Estudiante José Narváez:</text>
  <text x="380" y="156" font-family="sans-serif" font-size="12" fill="#e0e7ff">¿Cuáles son los prerrequisitos para matricular Ingeniería de Software II?</text>

  <!-- Chat message 2 (Unimagdalena AI Bot response) -->
  <rect x="40" y="185" width="480" height="110" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">🤖 Asistente Unimagdalena IA (PLN):</text>
  <text x="60" y="232" font-family="sans-serif" font-size="12" fill="#ffffff">Para matricular **Ingeniería de Software II** debes tener aprobadas:</text>
  <text x="60" y="252" font-family="sans-serif" font-size="12" fill="#38bdf8">• Ingeniería de Software I (Código 4502)</text>
  <text x="60" y="272" font-family="sans-serif" font-size="12" fill="#38bdf8">• Bases de Datos Avanzadas y 90 créditos aprobados.</text>

  <!-- Chat message 3 (Student) -->
  <rect x="380" y="310" width="380" height="45" rx="12" fill="#2563eb"/>
  <text x="400" y="337" font-family="sans-serif" font-size="12" fill="#ffffff">¿Cuándo son las fechas de tutorías de Algoritmos?</text>

  <!-- Chat input bar -->
  <rect x="40" y="375" width="720" height="45" rx="22" fill="#334155"/>
  <text x="60" y="402" font-family="sans-serif" font-size="13" fill="#94a3b8">Escribe tu consulta académica sobre Ingeniería de Sistemas...</text>
  <circle cx="735" cy="397" r="14" fill="#fbbf24"/>
  <polygon points="730,392 742,397 730,402" fill="#0f172a"/>
</svg>
